name: CI Debug Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache_warm:
        description: Build trusted default-branch sources to warm shared caches without running tests.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-debug-tests-${{ inputs.cache_warm == true && 'trusted-cache-warm' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-debug:
    name: Linux Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.tools/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-linux
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg-binary,readwrite
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg-downloads
      VCPKG_COMMIT: 9d7f79f56ae1a9b4704d6a7fb8237e347a974133
      GODOT_VERSION: 4.7.1
      GODOT_DIR: ${{ github.workspace }}/.tools/godot-4.7.1
      BUILD_DIR: ${{ github.workspace }}/out/linux-debug
      LOG_DIR: ${{ github.workspace }}/out/ci-results
      CACHE_WARMING: ${{ inputs.cache_warm == true && 'true' || 'false' }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Check out exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.cache_warm == true && github.event.repository.default_branch || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ inputs.cache_warm == true && 0 || 1 }}

      - name: Verify exact and trusted source
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ "$CACHE_WARMING" == "true" ]]; then
            git fetch --no-tags origin "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
            trusted_sha="$(git rev-parse "refs/remotes/origin/${{ github.event.repository.default_branch }}")"
            test "$source_sha" = "$trusted_sha"
          else
            test "$source_sha" = "${{ github.event.pull_request.head.sha || github.sha }}"
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          mkdir -p "$LOG_DIR" "$VCPKG_DOWNLOADS" "${{ github.workspace }}/.cache/vcpkg-binary" "${{ github.workspace }}/.tools"
          { echo "Source SHA: $source_sha"; echo "Cache warming: $CACHE_WARMING"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Install required build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential curl git ninja-build pkg-config python3 ripgrep unzip zip
          command -v rg
          rg --version

      - name: Define compiler and cache compatibility
        id: compiler
        run: |
          set -euo pipefail
          compiler_identity="gcc-$(gcc -dumpfullversion -dumpversion)-$(gcc -dumpmachine)"
          compiler_key="$(printf '%s' "$compiler_identity" | tr -c 'A-Za-z0-9._-' '-')"
          namespace="peraviz-ci-v2-linux-${{ runner.arch }}-${compiler_key}-debug"
          echo "identity=$compiler_identity" >> "$GITHUB_OUTPUT"
          echo "key=$compiler_key" >> "$GITHUB_OUTPUT"
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "SCCACHE_GHA_VERSION=$namespace" >> "$GITHUB_ENV"
          { uname -a; cmake --version; ninja --version; gcc --version; } | tee "$LOG_DIR/environment.txt"

      - name: Restore vcpkg downloads
        id: vcpkg-downloads-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/vcpkg-downloads
          key: vcpkg-downloads-v2-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ env.VCPKG_COMMIT }}-${{ hashFiles('native/vcpkg.json') }}-${{ steps.compiler.outputs.key }}-debug
          restore-keys: |
            vcpkg-downloads-v2-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ env.VCPKG_COMMIT }}-${{ hashFiles('native/vcpkg.json') }}-

      - name: Restore vcpkg binary archives
        id: vcpkg-binary-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/vcpkg-binary
          key: vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ env.VCPKG_COMMIT }}-${{ hashFiles('native/vcpkg.json') }}-${{ steps.compiler.outputs.key }}-debug
          restore-keys: |
            vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-x64-linux-${{ env.VCPKG_COMMIT }}-${{ hashFiles('native/vcpkg.json') }}-${{ steps.compiler.outputs.key }}-

      - name: Bootstrap pinned vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        with:
          version: v0.15.0

      - name: Reset compiler cache statistics
        run: |
          "$SCCACHE_PATH" --start-server
          "$SCCACHE_PATH" --zero-stats

      - name: Configure native Debug tests
        run: |
          set -euo pipefail
          cmake -S native -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_PATH" 2>&1 | tee "$LOG_DIR/cmake-configure.log"
          test -f "$BUILD_DIR/compile_commands.json"
          if grep -Eq '(^|[[:space:]\"])-DNDEBUG([[:space:]\"]|$)' "$BUILD_DIR/compile_commands.json"; then
            echo "Debug tests must not compile with NDEBUG" >&2
            exit 1
          fi

      - name: Save vcpkg downloads
        id: vcpkg-downloads-save
        if: steps.vcpkg-downloads-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/vcpkg-downloads
          key: ${{ steps.vcpkg-downloads-restore.outputs.cache-primary-key }}

      - name: Save vcpkg binary archives
        id: vcpkg-binary-save
        if: steps.vcpkg-binary-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/vcpkg-binary
          key: ${{ steps.vcpkg-binary-restore.outputs.cache-primary-key }}

      - name: Generate and validate CTest inventory
        run: |
          ctest --test-dir "$BUILD_DIR" -N -V | tee "$LOG_DIR/ctest-inventory.txt"
          ctest --test-dir "$BUILD_DIR" --show-only=json-v1 > "$LOG_DIR/ctest-inventory.json"
          python3 .github/scripts/validate_ctest_inventory.py "$LOG_DIR/ctest-inventory.json"

      - name: Build complete native target set
        run: cmake --build "$BUILD_DIR" --target all --verbose 2>&1 | tee "$LOG_DIR/build.log"

      - name: Capture compiler cache statistics
        id: sccache-stats
        if: always()
        run: |
          "$SCCACHE_PATH" --show-stats | tee "$LOG_DIR/sccache.txt"
          "$SCCACHE_PATH" --show-stats --stats-format json > "$LOG_DIR/sccache.json"

      - name: Restore pinned Godot distribution
        id: godot-restore
        uses: actions/cache/restore@v4
        with:
          path: .tools/godot-4.7.1
          key: godot-dist-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}

      - name: Install and verify pinned Godot
        run: |
          set -euo pipefail
          godot_bin="$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          if [[ "${{ steps.godot-restore.outputs.cache-hit }}" != "true" ]]; then
            rm -rf "$GODOT_DIR"
            mkdir -p "$GODOT_DIR"
            curl --fail --location --retry 3 \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
              --output /tmp/godot.zip
            unzip -q /tmp/godot.zip -d "$GODOT_DIR"
          fi
          test -x "$godot_bin"
          "$godot_bin" --version | tee "$LOG_DIR/godot-version.txt"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"

      - name: Save pinned Godot distribution
        id: godot-save
        if: steps.godot-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tools/godot-4.7.1
          key: ${{ steps.godot-restore.outputs.cache-primary-key }}

      - name: Run complete unfiltered CTest suite
        if: env.CACHE_WARMING != 'true'
        run: |
          set +e
          ctest --test-dir "$BUILD_DIR" --output-on-failure --verbose --timeout 120 \
            --output-log "$LOG_DIR/ctest.log" --output-junit "$LOG_DIR/ctest.junit.xml"
          status=$?
          cp "$BUILD_DIR/Testing/Temporary/LastTest.log" "$LOG_DIR/LastTest.log" 2>/dev/null || true
          cp "$BUILD_DIR/Testing/Temporary/LastTestsFailed.log" "$LOG_DIR/LastTestsFailed.log" 2>/dev/null || true
          python3 .github/scripts/validate_ctest_inventory.py "$LOG_DIR/ctest-inventory.json" --junit "$LOG_DIR/ctest.junit.xml"
          summary_status=$?
          (( status == 0 && summary_status == 0 ))

      - name: Run repository shell policy checks
        if: env.CACHE_WARMING != 'true'
        run: |
          tests/check_no_large_files.sh
          tests/check_no_large_files_test.sh
          tests/check_runtime_architecture.sh

      - name: Import project and register native classes
        if: env.CACHE_WARMING != 'true'
        run: |
          timeout 120 "$GODOT_BIN" --headless --audio-driver Dummy --rendering-method gl_compatibility --editor --path "${{ github.workspace }}" --quit 2>&1 | tee "$LOG_DIR/godot-import.log"

      - name: Run every headless GDScript test
        if: env.CACHE_WARMING != 'true'
        run: |
          python3 .github/scripts/run_gdscript_tests.py --godot "$GODOT_BIN" --project "${{ github.workspace }}" --output "$LOG_DIR/gdscript" --timeout 60

      - name: Summarize cache behavior
        if: always() && steps.compiler.outcome == 'success' && steps.sccache-stats.outcome == 'success'
        run: |
          python3 .github/scripts/summarize_ci_caches.py \
            --summary "$GITHUB_STEP_SUMMARY" --stats "$LOG_DIR/sccache.json" \
            --namespace "${{ steps.compiler.outputs.namespace }}" --compiler "${{ steps.compiler.outputs.identity }}" \
            --downloads-hit "${{ steps.vcpkg-downloads-restore.outputs.cache-hit || 'false' }}" --downloads-save "${{ steps.vcpkg-downloads-save.outcome }}" \
            --binary-hit "${{ steps.vcpkg-binary-restore.outputs.cache-hit || 'false' }}" --binary-save "${{ steps.vcpkg-binary-save.outcome }}" \
            --godot-hit "${{ steps.godot-restore.outputs.cache-hit || 'false' }}" --godot-save "${{ steps.godot-save.outcome }}"

      - name: Upload test inventories and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug-test-results-${{ github.run_attempt }}
          path: out/ci-results
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug-failure-diagnostics-${{ github.run_attempt }}
          path: |
            out/ci-results
            out/linux-debug/CMakeCache.txt
            out/linux-debug/CMakeFiles/CMakeConfigureLog.yaml
            out/linux-debug/compile_commands.json
          if-no-files-found: warn
          retention-days: 14
